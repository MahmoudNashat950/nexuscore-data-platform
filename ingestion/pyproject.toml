[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexuscore-ingestion"
version = "0.1.0"
description = "NexusCore telemetry ingestion service"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt==2.1.0",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic==2.12.5",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[tool.setuptools.packages.find]
where = ["src"]